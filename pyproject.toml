[project]
name = "bedrock-agent-eval"
version = "0.1.0"
description = "An Amazon Bedrock agent with native structured outputs, a deterministic evaluation gate and per-call cost accounting: meeting transcript -> Jira task drafts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The MCP server is the only component that needs these, and everything else imports it
# lazily, so the core evaluation works from a bare install.
dev = ["ruff>=0.6"]
mcp = ["fastmcp>=4"]
# Needed only when authenticating with `aws login` instead of static IAM credentials:
# botocore's login credential provider requires the AWS Common Runtime. Everything here
# works without it when a normal access key is in ~/.aws/credentials.
login = ["botocore[crt]>=1.35"]

[project.scripts]
bedrock-agent-eval = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
